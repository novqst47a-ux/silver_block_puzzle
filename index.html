<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f4e9">
  <title>한 줄 마당 · 블록 퍼즐</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./storage.js"></script>
  <script defer src="./rules.js"></script>
  <script defer src="./portraits.js"></script>
  <script defer src="./game.js"></script>
  <script defer src="./install.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="icons"><defs>
<symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 2-2.5 2.1-2.5 4M12 17h.01"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3.5"/></symbol>
<symbol id="undo" viewBox="0 0 24 24"><path d="m9 4-6 6 6 6M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></symbol>
<symbol id="hint" viewBox="0 0 24 24"><path d="M8 15a7 7 0 1 1 8 0l-1 3H9zM10 21h4"/></symbol>
<symbol id="trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H3v2a4 4 0 0 0 5 4m9-6h4v2a4 4 0 0 1-5 4m-4 1v6m-4 1h8"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/></symbol>
<symbol id="tap" viewBox="0 0 24 24"><path d="M8 12V6a2 2 0 0 1 4 0v5l2-1 5 2v4c0 4-2 5-5 5h-2c-2 0-3-1-4-2l-4-5a2 2 0 0 1 3-2l2 2"/></symbol>
</defs></svg>
<header><div class="mast">
<h1><img src="./icon.svg" alt="">한 줄 마당</h1>
<nav aria-label="게임 메뉴"><button id="helpBtn"><svg><use href="#help"/></svg>놀이 방법</button><button id="pauseBtn"><svg><use href="#pause"/></svg>쉬기</button></nav>
</div></header>
<main>
<section class="play" aria-label="퍼즐 마당">
<div class="boardhead"><h2><svg><use href="#grid"/></svg><span id="boardTitle">8×8 놀이판</span></h2><div id="sizes" class="switch" role="group" aria-label="판 크기" hidden></div><button id="photoBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m4 18 5-5 4 3 3-5 5 5"/></svg>사진 꾸미기</button></div>
<div class="frame"><div id="board" role="grid" aria-label="놀이판"></div><div id="celebration" aria-hidden="true"></div></div>
<div class="trayhead"><h2>놓을 조각</h2><span>원하는 조각부터</span></div>
<div id="tray" role="group" aria-label="놓을 조각 세 개"></div>
</section>
<aside aria-label="기록과 놀이 도구">
<section class="scorecard"><h2><svg><use href="#trophy"/></svg>이번 판 기록</h2><div class="scores"><div><span>내 점수</span><strong id="score">0</strong></div><div><span>최고 기록</span><strong id="best">0</strong></div></div></section>
<section class="controls"><h2><svg><use href="#tap"/></svg>한 수 놓기</h2>
<p id="instruction" role="status">조각을 누르고 빈칸을 누르세요. 끌어서 놓아도 좋아요.</p>
<div class="actionrow"><button id="undoBtn"><svg><use href="#undo"/></svg>되돌리기</button><button id="hintBtn"><svg><use href="#hint"/></svg>자리 보기</button></div>
<button id="endBtn" hidden>새 판 시작</button></section>
<button id="installBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>앱 설치</button>
</aside>
</main>
<div id="notice" role="status"></div>
<dialog id="panel"><div class="dialoghead"><h2 id="panelTitle"></h2><button id="closeBtn" aria-label="닫기">×</button></div><div id="panelBody"></div></dialog>
<noscript>게임을 하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body></html>
