<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3eee3">
  <title>한 줄 마당 · 블록 퍼즐</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./storage.js"></script>
  <script defer src="./rules.js"></script>
  <script defer src="./portraits.js"></script>
  <script defer src="./effects.js"></script>
  <script defer src="./game.js"></script>
  <script defer src="./install.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="icons-sprite"><defs>
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H3v2a4 4 0 0 0 5 4m9-6h4v2a4 4 0 0 1-5 4m-4 1v6m-4 1h8"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="m9 4-6 6 6 6M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></symbol>
<symbol id="i-hint" viewBox="0 0 24 24"><path d="M8 15a7 7 0 1 1 8 0l-1 3H9zM10 21h4"/></symbol>
<symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m4 18 5-5 4 3 3-5 5 5"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 2-2.5 2.1-2.5 4M12 17h.01"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3.2"/></symbol>
<symbol id="i-tap" viewBox="0 0 24 24"><path d="M8 12V6a2 2 0 0 1 4 0v5l2-1 5 2v4c0 4-2 5-5 5h-2c-2 0-3-1-4-2l-4-5a2 2 0 0 1 3-2l2 2"/></symbol>
</defs></svg>

<div id="screenFlash" aria-hidden="true"></div>
<div class="app-shell" id="appShell">
  <div id="notice" role="status"></div>
  <header><div class="mast">
    <h1 class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#182938"/>
        <rect x="10" y="10" width="20" height="20" rx="5" fill="#ffaa00"/>
        <rect x="34" y="10" width="20" height="20" rx="5" fill="#00b862"/>
        <rect x="10" y="34" width="20" height="20" rx="5" fill="#ee2e38"/>
        <rect x="34" y="34" width="20" height="20" rx="5" fill="#1a6bff"/>
      </svg>
      한 줄 마당
    </h1>
    <nav class="top-nav" aria-label="게임 메뉴">
      <button id="photoBtn" class="photo-trigger" type="button" aria-haspopup="dialog"><svg class="icon"><use href="#i-photo"/></svg>사진 꾸미기</button>
      <button id="helpBtn" type="button"><svg class="icon"><use href="#i-help"/></svg>놀이 방법</button>
      <button id="pauseBtn" type="button"><svg class="icon"><use href="#i-pause"/></svg>쉬기</button>
    </nav>
  </div></header>

  <main>
    <section class="play-col" aria-label="퍼즐 마당">
      <div class="board-bar">
        <h2><svg class="icon"><use href="#i-grid"/></svg><span id="boardTitle">8×8 놀이판</span></h2>
        <div id="sizes" class="switch" role="group" aria-label="판 크기" hidden></div>
      </div>

      <div class="frame" id="boardFrame">
        <div id="board" role="grid" aria-label="놀이판"></div>
        <div id="fxLayer" aria-hidden="true"></div>
        <div id="celebrationStage" aria-hidden="true">
          <canvas id="fxCanvas"></canvas>
          <div id="heroMount"></div>
        </div>
      </div>

      <div class="tray-head">
        <h2>놓을 조각</h2>
        <span>원하는 조각부터 놓으세요</span>
      </div>
      <div id="tray" role="group" aria-label="놓을 조각 세 개"></div>
    </section>

    <aside class="side-col" aria-label="점수판과 놀이 도구">
      <section id="scoreboard" class="scoreboard" aria-label="이번 판 점수판">
        <div class="sb-top">
          <span class="sb-label"><svg class="icon"><use href="#i-trophy"/></svg><span class="sb-title">이번 판 점수판</span><span class="sb-short">내 점수</span></span>
          <div class="sb-badges">
            <span id="streakBadge" class="combo-indicator" hidden></span>
            <span id="recordSeal" class="record-seal" hidden>신기록 달성</span>
            <span id="rankPill" class="rank-pill">몸풀기 중</span>
          </div>
        </div>

        <div class="sb-main">
          <div class="score-primary">
            <span class="score-caption">내 점수</span>
            <div class="score-value-row">
              <strong id="score" class="score-now">0</strong>
              <span id="scoreDelta" class="score-delta" hidden>+0</span>
            </div>
          </div>
          <div class="score-best-box">
            <span>최고 기록</span>
            <strong id="best">0</strong>
          </div>
        </div>

        <div class="sb-goal">
          <div class="sb-goal-meta">
            <span id="goalText"></span>
            <span class="sb-lines-stat">지운 줄 <b id="linesCount">0</b>줄</span>
          </div>
          <div class="sb-track" aria-hidden="true"><div id="goalFill" class="sb-fill"></div></div>
        </div>
      </section>

      <section class="controls-card" aria-label="한 수 놓기">
        <h2><svg class="icon"><use href="#i-tap"/></svg>한 수 놓기</h2>
        <p id="instruction" class="instruction" role="status">조각을 누르고 빈칸을 누르세요. 끌어서 점선 위치에 놓아도 좋아요.</p>
        <div class="action-row">
          <button id="undoBtn" type="button"><svg class="icon"><use href="#i-undo"/></svg>되돌리기</button>
          <button id="hintBtn" type="button"><svg class="icon"><use href="#i-hint"/></svg>자리 보기</button>
          <button id="endBtn" class="primary" type="button" hidden>새 판 시작</button>
        </div>
      </section>

      <div class="rules-plaque" aria-label="점수 안내">
        <strong>고득점 보너스 안내</strong>
        <div class="rules-list">
          <div><span>1줄 완성</span><b>+10점</b></div>
          <div><span>2줄 동시</span><b>+30점</b></div>
          <div><span>3줄 이상</span><b>+60점</b></div>
        </div>
      </div>

      <button id="installBtn" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>앱 설치</button>
    </aside>
  </main>
</div>

<dialog id="panel"><div class="dialog-head"><h2 id="panelTitle"></h2><button id="closeBtn" class="dialog-close" type="button" aria-label="닫기">×</button></div><div id="panelBody"></div></dialog>
<noscript>게임을 하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body></html>
